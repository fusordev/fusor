name: Test262

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test262:
    name: Full Test262 (latest upstream)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check out latest Test262 and configure the custom filter policy
        shell: bash
        run: |
          test262_dir="$RUNNER_TEMP/test262"
          git clone --depth=1 https://github.com/tc39/test262.git "$test262_dir"
          git -C "$test262_dir" config core.autocrlf false
          git -C "$test262_dir" rev-parse HEAD
          echo "TEST262_PATH=$test262_dir" >> "$GITHUB_ENV"
      - name: Run complete configured Test262 suite and print passing rate
        shell: bash
        run: |
          ulimit -s 65520
          test262_jobs="$(getconf _NPROCESSORS_ONLN)"
          echo "Test262 workers: $test262_jobs"
          cargo run --release --quiet -p xtask -- test262 --suite "$TEST262_PATH" --baseline tests/test262/upstream --instruction-fuel 50000000 --jobs "$test262_jobs" --progress-every 1000 --report target/test262/report.json
      - name: Upload Test262 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-report
          path: target/test262/report.json
          if-no-files-found: warn
