name: Test262

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test262:
    name: Full Test262 (pinned baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check out the pinned Test262 suite and QuickJS baseline
        shell: bash
        run: |
          test262_dir="$RUNNER_TEMP/test262"
          git clone https://github.com/tc39/test262.git "$test262_dir"
          git -C "$test262_dir" config core.autocrlf false
          git -C "$test262_dir" checkout --detach 5c8206929d81b2d3d727ca6aac56c18358c8d790
          git -C "$test262_dir" apply --whitespace=nowarn "$GITHUB_WORKSPACE/tests/test262/upstream/test262.patch"
          echo "TEST262_PATH=$test262_dir" >> "$GITHUB_ENV"
      - name: Run complete configured Test262 suite and print passing rate
        run: cargo xtask test262 --suite "$TEST262_PATH" --report target/test262/report.json
      - name: Upload Test262 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-report
          path: target/test262/report.json
          if-no-files-found: error
