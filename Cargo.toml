[workspace]
members = ["crates/quickjs-diagnostics", "crates/quickjs-frontend", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
miette = { version = "=7.6.0", default-features = false, features = ["fancy-no-syscall"] }
oxc_allocator = "=0.142.0"
oxc_ast = "=0.142.0"
oxc_diagnostics = "=0.142.0"
oxc_parser = { version = "=0.142.0", default-features = false }
oxc_semantic = "=0.142.0"
oxc_span = "=0.142.0"
serde_json = "=1.0.151"
sourcemap = { version = "=9.3.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
