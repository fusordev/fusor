[workspace]
members = ["crates/quickjs-frontend"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
oxc_allocator = "=0.142.0"
oxc_ast = "=0.142.0"
oxc_diagnostics = "=0.142.0"
oxc_parser = { version = "=0.142.0", default-features = false }
oxc_semantic = "=0.142.0"
oxc_span = "=0.142.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
