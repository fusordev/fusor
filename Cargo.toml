[workspace]
members = [
    "crates/quickjs",
    "crates/quickjs-bytecode",
    "crates/quickjs-compiler",
    "crates/quickjs-diagnostics",
    "crates/quickjs-frontend",
    "crates/quickjs-intl",
    "crates/quickjs-regexp",
    "crates/quickjs-runtime",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
fixed_decimal = { version = "=0.7.2", features = ["ryu"] }
icu = { version = "=2.2.0", default-features = false }
icu_casemap = "=2.2.0"
icu_locale_core = "=2.2.0"
icu_normalizer = { version = "=2.2.0", default-features = false, features = ["compiled_data"] }
icu_properties = "=2.2.0"
miette = { version = "=7.6.0", default-features = false, features = ["fancy-no-syscall"] }
oxc_allocator = "=0.142.0"
oxc_ast = "=0.142.0"
oxc_diagnostics = "=0.142.0"
oxc_parser = { version = "=0.142.0", default-features = false }
oxc_regular_expression = "=0.142.0"
oxc_semantic = "=0.142.0"
oxc_span = "=0.142.0"
oxc_syntax = "=0.142.0"
rayon = "=1.12.0"
serde_json = "=1.0.151"
serde_yaml_ng = "=0.10.0"
sourcemap = { version = "=9.3.2", default-features = false }
temporal_rs = "=0.2.5"
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "sync"] }
writeable = "=0.6.3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
