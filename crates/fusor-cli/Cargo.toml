[package]
name = "fusor-cli"
version = "0.0.1"
description = "Node-like resolver, `fusor` module runner, and ESM REPL for the Experimental JavaScript Engine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "fusor"
path = "src/main.rs"

[dependencies]
fusor = { path = "../fusor" }
fusor-cdp = { path = "../fusor-cdp" }
fusor-runtime = { path = "../fusor-runtime" }
tokio = { workspace = true, features = ["fs", "macros"] }
miette = { workspace = true }
serde_json.workspace = true
rustyline = { workspace = true }

[lints]
workspace = true
